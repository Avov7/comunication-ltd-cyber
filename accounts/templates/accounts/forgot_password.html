{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<h2>Forgot Password</h2>
<form method="post">
    {% csrf_token %}
    <label>Email address</label>
    <input type="email" name="email" required>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <button type="submit">Send Reset Token</button>
</form>
{% endblock %}
